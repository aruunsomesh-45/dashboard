services:
  db:
    image: postgres:16-alpine
    container_name: ci_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: commerce_intel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
