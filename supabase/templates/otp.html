<!doctype html>
<html>
  <body style="margin:0;padding:24px;background:#faf7f0;font-family:Helvetica,Arial,sans-serif;color:#1f1f1f;">
    <table role="presentation" width="100%" style="max-width:440px;margin:0 auto;background:#ffffff;border:1px solid #e8e2d4;border-radius:16px;padding:32px;">
      <tr><td>
        <div style="display:inline-block;background:#c9654a;color:#fff;font-weight:700;border-radius:10px;padding:8px 12px;">125</div>
        <h1 style="font-size:18px;margin:20px 0 4px;">Your sign-in code</h1>
        <p style="font-size:13px;color:#6b6b6b;margin:0 0 20px;">Enter this code on the 125 East sign-in screen.</p>
        <p style="font-size:34px;letter-spacing:10px;font-weight:700;font-family:Consolas,monospace;margin:0 0 20px;">{{ .Token }}</p>
        <p style="font-size:12px;color:#6b6b6b;margin:0;">This code expires in 10 minutes and can be used once. If you didn't request it, you can safely ignore this email &mdash; nobody can sign in without it.</p>
      </td></tr>
    </table>
  </body>
</html>
